[workspace]
resolver = "2"
members = [
    "flight_software/core/coordination/multi_agency_protocol",
    "flight_software/core/coordination/autonomous_scheduler",
    "flight_software/core/coordination/distributed_pnt",
    "flight_software/core/communication/dtn_plus",
    "flight_software/core/communication/mesh_network",
    "flight_software/core/health_management",
    "flight_software/integration/hardware_drivers/radiation_tolerant_hal",
    "flight_software/integration/agency_interfaces/nasa_jpl",
    "flight_software/integration/agency_interfaces/spacex",
    "flight_software/integration/agency_interfaces/esa",
    "flight_software/integration/agency_interfaces/cnsa",
    "flight_software/security",
    "tools/mission_control_software",
    "tools/deployment_tools/config_generator",
    "flight_software/integration/asterquanta_bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SpaceOne Team"]
license = "Apache-2.0"
repository = "https://github.com/spaceone/spaceone"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
aes-gcm = "0.10"
sha3 = "0.10"
hex = "0.4"
async-trait = "0.1"
bincode = "1.3"
prost = "0.12"
prost-types = "0.12"
