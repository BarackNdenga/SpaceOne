[system]
compatible=asterquanta-qemux86-64
bootloader=grub
mountprefix=/mnt/rauc
statusfile=/data/rauc.status

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs_a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs_b
type=ext4
bootname=B

# Note securite: keyring.pem doit contenir le certificat public
# correspondant a la cle privee utilisee pour signer les bundles
# .raucb avec `rauc bundle`. La cle privee ne doit JAMAIS etre incluse
# dans l'image ni dans ce depot — la garder hors du repo, cote CI/signeur.
